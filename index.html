<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>霖林小屋 · Linlin Cabin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #dfeaf2;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
      "Microsoft YaHei", "Segoe UI", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1b2430;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .card {
    position: fixed;
    background: rgba(255, 255, 255, 0.56);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 12px 38px rgba(18, 32, 48, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    border-radius: 18px;
    z-index: 10;
  }

  #title-card { top: 22px; left: 22px; padding: 15px 22px 14px; min-width: 178px; }
  #title-card h1 {
    font-size: 19px; font-weight: 600; letter-spacing: 3px; line-height: 1;
    color: #1b2430; display: flex; align-items: center; gap: 8px;
  }
  #title-card h1::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: linear-gradient(160deg, #ffd24a, #ff9f1c);
    box-shadow: 0 0 8px rgba(255, 176, 48, 0.75);
  }
  #title-card p {
    font-size: 9.5px; letter-spacing: 3.4px; color: #8494a4;
    margin-top: 8px; text-transform: uppercase; font-weight: 500;
  }

  #weather-bar {
    left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 6px; border-radius: 20px;
  }
  .wbtn {
    border: 0; background: transparent; font-family: inherit; font-size: 12.5px;
    color: #46525f; padding: 8px 13px; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: background .3s cubic-bezier(.4,0,.2,1), color .3s cubic-bezier(.4,0,.2,1),
      box-shadow .3s cubic-bezier(.4,0,.2,1), transform .15s ease;
  }
  .wbtn .ic { font-size: 13px; line-height: 1; }
  .wbtn:hover { background: rgba(255, 255, 255, 0.5); }
  .wbtn:active { transform: scale(0.96); }
  .wbtn.on {
    background: #ffffff; color: #10151b;
    box-shadow: 0 2px 9px rgba(20, 34, 50, 0.14), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  }

  #info-card { right: 22px; bottom: 26px; padding: 12px 15px 11px; min-width: 166px; }
  #info-card .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; font-size: 11px; color: #5c6a78; line-height: 1.7;
  }
  #info-card .row b { font-weight: 600; color: #1f2a36; }
  #info-card .hint {
    font-size: 10px; color: #8d9aa7; letter-spacing: .3px; margin-top: 6px;
    padding-top: 7px; border-top: 1px solid rgba(120, 140, 160, 0.18);
  }
  #orbit-toggle {
    border: 0; background: rgba(140, 155, 170, 0.18); font-family: inherit;
    font-size: 10px; color: #5c6a78; padding: 3px 8px; border-radius: 8px;
    cursor: pointer; transition: background .2s, color .2s;
  }
  #orbit-toggle.on { background: rgba(60, 140, 235, 0.16); color: #1f6fd0; }

  #loader {
    position: fixed; inset: 0; z-index: 60;
    background: linear-gradient(165deg, #f8fbff 0%, #e9f1f7 55%, #dfeaf2 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; transition: opacity .85s ease, visibility .85s ease;
  }
  #loader.hide { opacity: 0; visibility: hidden; }
  #loader .ring {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid rgba(120, 150, 180, 0.22);
    border-top-color: #ffb300;
    animation: spin 0.9s linear infinite;
  }
  #loader .txt { font-size: 13px; letter-spacing: 4px; color: #6d7d8d; font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    #title-card { top: 14px; left: 14px; padding: 11px 15px 10px; border-radius: 14px; min-width: 0; }
    #title-card h1 { font-size: 15px; letter-spacing: 2px; }
    #title-card p { font-size: 8px; letter-spacing: 2.4px; margin-top: 6px; }
    #weather-bar { bottom: 14px; gap: 0; padding: 4px; border-radius: 16px; max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
    #weather-bar::-webkit-scrollbar { display: none; }
    .wbtn { font-size: 10.5px; padding: 7px 8px; gap: 3px; border-radius: 12px; }
    .wbtn .ic { font-size: 11px; }
    #info-card { right: 14px; bottom: 62px; padding: 9px 11px; min-width: 0; border-radius: 13px; }
    #info-card .row { font-size: 9.5px; gap: 10px; }
    #info-card .hint { font-size: 8.5px; margin-top: 5px; padding-top: 5px; }
    #loader .txt { font-size: 11px; letter-spacing: 3px; }
  }

  @media (max-width: 430px) {
    #title-card { top: 10px; left: 10px; padding: 9px 12px 8px; border-radius: 12px; }
    #title-card h1 { font-size: 13px; letter-spacing: 1.5px; }
    #title-card p { font-size: 7px; letter-spacing: 2px; margin-top: 4px; }
    #weather-bar { bottom: 10px; padding: 3px; border-radius: 14px; max-width: calc(100vw - 14px); }
    .wbtn { font-size: 9.5px; padding: 6px 5px; gap: 2px; border-radius: 10px; }
    .wbtn .ic { font-size: 10px; }
    #info-card { right: 10px; bottom: 52px; padding: 8px 9px; border-radius: 11px; }
    #info-card .row { font-size: 9px; gap: 8px; }
    #info-card .hint { font-size: 8px; margin-top: 4px; padding-top: 4px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="title-card" class="card">
  <h1>霖林小屋</h1>
  <p>Linlin&nbsp;Cabin</p>
</div>

<nav id="weather-bar" class="card"></nav>

<aside id="info-card" class="card">
  <div class="row"><span>天气</span><b id="i-weather">晴天</b></div>
  <div class="row"><span>帧率</span><b id="i-fps">60</b></div>
  <div class="row"><span>自动环绕</span><button id="orbit-toggle" class="on">开启</button></div>
  <div class="hint">拖拽旋转 · 滚轮缩放<br>点击小动物 · 1-6 换天气</div>
</aside>

<div id="loader"><div class="ring"></div><div class="txt">霖林小屋 · 正在搭建…</div></div>

<script src="assets/three.min.js"></script>
<script>
// ============================================================
// 配置区
// ============================================================
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
const PERF = IS_MOBILE ? 0.55 : 1;
const DPR_CAP = IS_MOBILE ? 1.5 : 2;
const CFG = {
  sunflowers: 118,
  weeds: 1320,
  wildflowers: 240,
  butterflies: 10,
  bees: 13,
  forestTrees: 40,
  rocks: 26,
  mushrooms: 22
};

const HUT = {
  hw: 3.2, hd: 2.5, wallH: 2.6, ridgeY: 4.35,
  logR: 0.155, rows: 9, eaveX: 3.78
};

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const STATS = {};
const pickFlowers = [];

let _seed = 20261020;
function R() {
  _seed = (_seed * 1664525 + 1013904223) >>> 0;
  return _seed / 4294967296;
}
function rnd(a, b) { return a + (b - a) * R(); }
function rint(a, b) { return Math.floor(a + (b - a + 1) * R()); }
function pick(arr) { return arr[Math.min(arr.length - 1, Math.floor(R() * arr.length))]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function C(hex) { return new THREE.Color(hex); }

function m4(x, y, z, rx, ry, rz, sx, sy, sz) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0));
  m.compose(
    new THREE.Vector3(x || 0, y || 0, z || 0),
    q,
    new THREE.Vector3(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz)
  );
  return m;
}

function scaleUV(geo, su, sv) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
  return geo;
}

function swapUV(geo) {
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getY(i), uv.getX(i));
  return geo;
}

function mergeGeos(items) {
  let total = 0;
  const prep = [];
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    let g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
    if (it.matrix) g.applyMatrix4(it.matrix);
    const uvAttr = g.attributes.uv;
    if (!uvAttr) {
      const n = g.attributes.position.count;
      g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    }
    total += g.attributes.position.count;
    prep.push({ g: g, color: it.color });
  }
  const pos = new Float32Array(total * 3);
  const nor = new Float32Array(total * 3);
  const uv = new Float32Array(total * 2);
  const col = new Float32Array(total * 3);
  let o = 0;
  for (let k = 0; k < prep.length; k++) {
    const g = prep[k].g, c = prep[k].color;
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    uv.set(g.attributes.uv.array, o * 2);
    const srcCol = g.attributes.color;
    if (c) {
      for (let i = 0; i < n; i++) {
        col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b;
      }
    } else if (srcCol) {
      col.set(srcCol.array, o * 3);
    } else {
      for (let i = 0; i < n; i++) { col[(o + i) * 3] = 1; col[(o + i) * 3 + 1] = 1; col[(o + i) * 3 + 2] = 1; }
    }
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  out.computeBoundingSphere();
  return out;
}

function Builder() {
  if (!(this instanceof Builder)) return new Builder();
  this.items = [];
}
Builder.prototype.add = function (geo, matrix, color, uvs, uvv) {
  if (uvs !== undefined) scaleUV(geo, uvs, uvv === undefined ? uvs : uvv);
  this.items.push({ geo: geo, matrix: matrix, color: color });
  return this;
};
Builder.prototype.raw = function (geo, matrix, color) {
  this.items.push({ geo: geo, matrix: matrix, color: color });
  return this;
};
Builder.prototype.build = function (material, opts) {
  const mesh = new THREE.Mesh(mergeGeos(this.items), material);
  mesh.castShadow = !(opts && opts.noCast);
  mesh.receiveShadow = !(opts && opts.noReceive);
  return mesh;
};

function applyHeightAttr(geo, maxY, pow) {
  const p = geo.attributes.position;
  const a = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) {
    const h = clamp(p.getY(i) / maxY, 0, 1);
    a[i] = Math.pow(h, pow === undefined ? 1.6 : pow);
  }
  geo.setAttribute('aH', new THREE.BufferAttribute(a, 1));
  return geo;
}

// ============================================================
// 纹理工厂
// ============================================================
function makeCanvas(w, h, draw) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  return cv;
}

function makeTex(cv, srgb) {
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function drawWood(g, w, h) {
  g.fillStyle = '#96643c';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 300; i++) {
    const x = R() * w;
    const light = R() < 0.52;
    g.strokeStyle = light ? 'rgba(196,148,101,0.15)' : 'rgba(56,32,17,0.17)';
    g.lineWidth = rnd(0.6, 3.6);
    g.beginPath();
    const ph = rnd(0, 9), amp = rnd(1.2, 5.5);
    for (let y = -8; y <= h + 8; y += 14) {
      const px = x + Math.sin(y * 0.021 + ph) * amp;
      if (y === -8) g.moveTo(px, y); else g.lineTo(px, y);
    }
    g.stroke();
  }
  for (let k = 0; k < 6; k++) {
    const cx = rnd(0, w), cy = rnd(0, h), rr = rnd(5, 15);
    for (let i = 4; i > 0; i--) {
      g.strokeStyle = 'rgba(54,31,15,' + (0.08 + i * 0.035) + ')';
      g.lineWidth = 1.3;
      g.beginPath();
      g.ellipse(cx, cy, rr * i * 0.52, rr * i * 0.82, 0, 0, Math.PI * 2);
      g.stroke();
    }
  }
  g.globalAlpha = 0.07;
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = R() < 0.5 ? '#000' : '#fff';
    g.fillRect(R() * w, R() * h, 1.6, 1.6);
  }
  g.globalAlpha = 1;
}

function drawPlank(g, w, h) {
  drawWood(g, w, h);
  const cols = 5, pw = w / cols;
  for (let i = 0; i <= cols; i++) {
    const x = i * pw;
    g.fillStyle = 'rgba(30,16,8,0.42)';
    g.fillRect(x - 1.4, 0, 2.8, h);
    g.fillStyle = 'rgba(214,170,124,0.22)';
    g.fillRect(x + 1.6, 0, 1.6, h);
  }
  g.globalAlpha = 0.12;
  for (let i = 0; i < 60; i++) {
    g.strokeStyle = R() < 0.5 ? '#2a1608' : '#c99560';
    g.lineWidth = rnd(0.8, 2);
    const y = R() * h;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + rnd(-4, 4)); g.stroke();
  }
  g.globalAlpha = 1;
}

function drawStone(g, w, h) {
  g.fillStyle = '#9a9691';
  g.fillRect(0, 0, w, h);
  const rows = 6, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -20 + R() * 30;
    while (x < w) {
      const bw = rnd(46, 104), bh = rh - rnd(4, 8);
      const y = r * rh + rnd(2, 5);
      const tone = rint(150, 205);
      g.fillStyle = 'rgb(' + tone + ',' + (tone - 6) + ',' + (tone - 16) + ')';
      g.beginPath();
      const rr = 6;
      g.moveTo(x + rr, y);
      g.lineTo(x + bw - rr, y); g.quadraticCurveTo(x + bw, y, x + bw, y + rr);
      g.lineTo(x + bw, y + bh - rr); g.quadraticCurveTo(x + bw, y + bh, x + bw - rr, y + bh);
      g.lineTo(x + rr, y + bh); g.quadraticCurveTo(x, y + bh, x, y + bh - rr);
      g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y);
      g.fill();
      for (let i = 0; i < 26; i++) {
        g.fillStyle = 'rgba(90,86,80,' + rnd(0.03, 0.12) + ')';
        g.fillRect(x + rnd(2, bw - 4), y + rnd(2, bh - 4), rnd(1, 5), rnd(1, 4));
      }
      x += bw + rnd(4, 9);
    }
  }
  g.globalAlpha = 0.35;
  for (let i = 0; i < 900; i++) {
    g.fillStyle = R() < 0.5 ? '#6b6863' : '#cfcac2';
    g.fillRect(R() * w, R() * h, rnd(1, 3), rnd(1, 3));
  }
  g.globalAlpha = 1;
}

function drawGrass(g, w, h) {
  g.fillStyle = '#679f47';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const x = rnd(0, w), y = rnd(0, h), r = rnd(40, 150);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, R() < 0.5 ? 'rgba(133,180,80,0.20)' : 'rgba(62,108,52,0.20)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 2000; i++) {
    const x = rnd(0, w), y = rnd(0, h), len = rnd(5, 17), sw = rnd(-0.7, 0.7);
    g.strokeStyle = 'hsla(' + rint(78, 108) + ',' + rint(34, 62) + '%,' + rint(26, 48) + '%,' + rnd(0.28, 0.62) + ')';
    g.lineWidth = rnd(0.9, 2.1);
    const draws = [0];
    if (x < 20) draws.push(w); if (x > w - 20) draws.push(-w);
    const drawsY = [0];
    if (y < 20) drawsY.push(h); if (y > h - 20) drawsY.push(-h);
    for (let a = 0; a < draws.length; a++) {
      for (let b = 0; b < drawsY.length; b++) {
        const px = x + draws[a], py = y + drawsY[b];
        g.beginPath();
        g.moveTo(px, py);
        g.quadraticCurveTo(px + len * sw * 0.4, py - len * 0.62, px + len * sw, py - len);
        g.stroke();
      }
    }
  }
}

function drawSoil(g, w, h) {
  g.fillStyle = '#6e5334';
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    const x = R() * w, y = R() * h, r = rnd(1, 5);
    g.fillStyle = 'rgba(' + rint(70, 130) + ',' + rint(54, 100) + ',' + rint(34, 66) + ',' + rnd(0.15, 0.55) + ')';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 260; i++) {
    g.fillStyle = 'rgba(' + rint(150, 195) + ',' + rint(142, 180) + ',' + rint(128, 160) + ',0.55)';
    g.beginPath(); g.ellipse(R() * w, R() * h, rnd(1, 4), rnd(1, 3), R() * 3, 0, 7); g.fill();
  }
}

function drawCloud(g, w, h) {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    const x = rnd(w * 0.16, w * 0.84), y = rnd(h * 0.34, h * 0.68);
    const r = rnd(h * 0.14, h * 0.36);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, 'rgba(255,255,255,0.95)');
    grd.addColorStop(0.55, 'rgba(255,255,255,0.56)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}

function drawGlass(g, w, h) {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, "#e2eff8");
  grd.addColorStop(0.42, "#b6cfdf");
  grd.addColorStop(1, "#78919f");
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
  g.globalAlpha = 0.3;
  g.fillStyle = "#ffffff";
  g.beginPath();
  g.moveTo(0, h * 0.12); g.lineTo(w * 0.46, 0); g.lineTo(w * 0.8, 0); g.lineTo(0, h * 0.66);
  g.fill();
  g.globalAlpha = 0.15;
  g.beginPath();
  g.moveTo(w * 0.62, 0); g.lineTo(w, 0); g.lineTo(w, h * 0.34); g.lineTo(w * 0.84, h * 0.4);
  g.fill();
  g.globalAlpha = 0.2;
  g.strokeStyle = "#41525e";
  g.lineWidth = w * 0.045;
  g.strokeRect(0, 0, w, h);
  g.globalAlpha = 1;
}

function drawSoft(g, w, h) {
  const grd = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.72)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
}

function drawHeart(g, w, h) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#ff7aa2';
  g.beginPath();
  const cx = w / 2, cy = h * 0.58, s = w * 0.30;
  g.moveTo(cx, cy + s * 0.95);
  g.bezierCurveTo(cx - s * 1.55, cy - s * 0.15, cx - s * 0.72, cy - s * 1.15, cx, cy - s * 0.42);
  g.bezierCurveTo(cx + s * 0.72, cy - s * 1.15, cx + s * 1.55, cy - s * 0.15, cx, cy + s * 0.95);
  g.fill();
  g.globalAlpha = 0.55;
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(cx - s * 0.42, cy - s * 0.42, s * 0.22, s * 0.15, -0.5, 0, 7); g.fill();
  g.globalAlpha = 1;
}

function drawSparkle(g, w, h) {
  g.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const grd = g.createRadialGradient(cx, cy, 0, cx, cy, w * 0.5);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,246,210,0.9)');
  grd.addColorStop(1, 'rgba(255,220,120,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(cx, cy, w * 0.5, 0, 7); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.95)';
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(cx, cy - h * 0.46); g.lineTo(cx, cy + h * 0.46); g.stroke();
  g.beginPath(); g.moveTo(cx - w * 0.46, cy); g.lineTo(cx + w * 0.46, cy); g.stroke();
}

function makeWindMaterial(opts) {
  const mat = new THREE.MeshLambertMaterial({
    vertexColors: true,
    side: opts && opts.doubleSide ? THREE.DoubleSide : THREE.FrontSide
  });
  const uni = {
    uTime: { value: 0 },
    uWind: { value: 1 },
    uGust: { value: new THREE.Vector4(0, 0, 0, 0) }
  };
  mat.userData.uni = uni;
  mat.onBeforeCompile = function (shader) {
    shader.uniforms.uTime = uni.uTime;
    shader.uniforms.uWind = uni.uWind;
    shader.uniforms.uGust = uni.uGust;
    shader.vertexShader = 'uniform float uTime;\nuniform float uWind;\nuniform vec4 uGust;\nattribute float aH;\nvarying float vWob;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      [
        'vec3 transformed = vec3( position );',
        'float phA = instanceMatrix[3].x * 0.85 + instanceMatrix[3].z * 1.31;',
        'float hh = aH;',
        'vWob = 0.0;',
        'vec3 wOff = vec3( 0.0 );',
        'wOff.x = ( sin( uTime * 1.25 + phA ) * 0.62 + sin( uTime * 0.71 + phA * 1.7 ) * 0.38 ) * hh * 0.085 * uWind;',
        'wOff.z = ( cos( uTime * 1.05 + phA * 1.3 ) * 0.55 + sin( uTime * 0.53 + phA * 0.4 ) * 0.45 ) * hh * 0.075 * uWind;',
        'float gd = distance( instanceMatrix[3].xz, uGust.xy );',
        'float gi = exp( -gd * 0.85 ) * uGust.w;',
        'wOff.xz += normalize( instanceMatrix[3].xz - uGust.xy + vec2( 0.0015 ) ) * gi * hh * 0.30;',
        'wOff.y -= gi * hh * 0.05;',
        'vWob = hh;'
      ].join('\n')
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <project_vertex>',
      [
        'vec4 mvPosition = vec4( transformed, 1.0 );',
        '#ifdef USE_INSTANCING',
        '  mvPosition = instanceMatrix * mvPosition;',
        '  mvPosition.xyz += wOff;',
        '#endif',
        'mvPosition = modelViewMatrix * mvPosition;',
        'gl_Position = projectionMatrix * mvPosition;'
      ].join('\n')
    );
  };
  return mat;
}

function buildSoilSpots() {
  const b = Builder();
  const pts = [];
  let guard = 0;
  while (pts.length < 17 && guard < 900) {
    guard++;
    const a = rnd(0, 6.283), rr = Math.sqrt(R()) * 8.8;
    const cx = Math.cos(a) * rr, cz = 8.4 + Math.sin(a) * rr * 0.66;
    if (Math.abs(cx) < 1.55 && cz > 3.4) continue;
    let ok = true;
    for (let i = 0; i < pts.length; i++) {
      if (Math.hypot(pts[i][0] - cx, pts[i][1] - cz) < 3.1) { ok = false; break; }
    }
    if (!ok) continue;
    pts.push([cx, cz]);
    const rad = rnd(1.2, 2.9);
    const g = new THREE.CircleGeometry(rad, 16);
    g.rotateX(-Math.PI / 2);
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const x = p.getX(k), z = p.getZ(k);
      if (Math.hypot(x, z) > 0.02) {
        const ang = Math.atan2(z, x);
        const w = 1 + Math.sin(ang * 3.1 + pts.length) * 0.24 + Math.cos(ang * 5.3 + pts.length * 1.7) * 0.15;
        p.setX(k, x * w); p.setZ(k, z * w);
      }
    }
    g.computeVertexNormals();
    scaleUV(g, 1.7, 1.7);
    b.raw(g, m4(cx, 0.016, cz, 0, rnd(0, 6.283), 0), null);
  }
  const mesh = b.build(matClearing, { noCast: true });
  mesh.receiveShadow = true;
  scene.add(mesh);
}

function buildMountains(rIn, rOut, baseY, hMin, hMax, colLow, colHigh, seedOff) {
  const seg = 84;
  const pos = [], col = [], idx = [];
  const cA = C(colLow), cB = C(colHigh);
  for (let i = 0; i <= seg; i++) {
    const a = (i / seg) * Math.PI * 2;
    const n = Math.sin(a * 2.3 + seedOff) * 0.5 + Math.sin(a * 4.1 + seedOff * 2.2) * 0.3 +
      Math.sin(a * 7.7 + seedOff * 3.1) * 0.2;
    const hh = hMin + (hMax - hMin) * (0.5 + n * 0.5);
    const rm = (rIn + rOut) * 0.5;
    pos.push(Math.cos(a) * rIn, baseY, Math.sin(a) * rIn);
    pos.push(Math.cos(a) * rm, hh, Math.sin(a) * rm);
    pos.push(Math.cos(a) * rOut, baseY + 2, Math.sin(a) * rOut);
    col.push(cA.r, cA.g, cA.b, cB.r, cB.g, cB.b, cA.r, cA.g, cA.b);
  }
  for (let i = 0; i < seg; i++) {
    const b = i * 3;
    idx.push(b, b + 1, b + 3, b + 1, b + 4, b + 3, b + 1, b + 2, b + 4, b + 2, b + 5, b + 4);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildForest() {
  const n = CFG.forestTrees;
  for (let i = 0; i < n; i++) {
    let a = (i / n) * Math.PI * 2 + rnd(-0.06, 0.06);

    if (Math.cos(a) > 0.62) r = rnd(33, 47);

    const conifer = i % 2 === 1;
    const th = conifer ? rnd(1.4, 2.4) : rnd(2.4, 3.8);
    const tw = conifer ? rnd(0.32, 0.48) : rnd(0.42, 0.62);
    treeData.push({ x: x, z: z, conifer: conifer, th: th, tw: tw, lean: rnd(-0.05, 0.05), rot: rnd(0, 6.28) });
  }
  const trunkGeo = new THREE.CylinderGeometry(0.55, 0.95, 1, 8);
  trunkGeo.translate(0, 0.5, 0);
  const trunkIM = new THREE.InstancedMesh(trunkGeo, matInstBark, n);

  for (let i = 0; i < n; i++) {
    const t = treeData[i];
    trunkIM.setMatrixAt(i, m4(t.x, 0, t.z, t.lean, t.rot, 0, t.tw, t.th, t.tw));
    c.setHSL(0.08, 0.30, 0.42 + rnd(-0.06, 0.06), THREE.SRGBColorSpace);
    trunkIM.setColorAt(i, c);
  }
  trunkIM.castShadow = true;
  trunkIM.receiveShadow = true;
  scene.add(trunkIM);

  const broad = treeData.filter(function (t) { return !t.conifer; });
  const coni = treeData.filter(function (t) { return t.conifer; });

  const blobGeo = new THREE.IcosahedronGeometry(1, 1);
  const blobIM = new THREE.InstancedMesh(blobGeo, matFoliage, broad.length * 3);
  let k = 0;
  for (let i = 0; i < broad.length; i++) {
    const t = broad[i];
    const cy = t.th + rnd(1.5, 2.4);
    const R0 = rnd(2.0, 3.1);
    for (let j = 0; j < 3; j++) {
      const ang = (j / 3) * 6.283 + rnd(-0.4, 0.4);
      const off = j === 0 ? 0 : rnd(0.8, 1.5);
      const br = R0 * (j === 0 ? 1 : rnd(0.6, 0.85));
      blobIM.setMatrixAt(k, m4(
        t.x + Math.cos(ang) * off, cy + rnd(-0.5, 0.9), t.z + Math.sin(ang) * off,
        rnd(0, 3), rnd(0, 6.28), rnd(0, 3), br, br * rnd(0.72, 0.92), br

      c.setHSL(0.27 + rnd(-0.035, 0.045), 0.55, 0.335 + rnd(-0.05, 0.06) - j * 0.02, THREE.SRGBColorSpace);
      blobIM.setColorAt(k, c);

  coneGeo.translate(0, 0.5, 0);

  for (let i = 0; i < coni.length; i++) {

      c.setHSL(0.33 + rnd(-0.03, 0.03), 0.52, 0.265 + rnd(-0.04, 0.05) + j * 0.015, THREE.SRGBColorSpace);
      coneIM.setColorAt(q, c);

  for (let i = 0; i < openings.length; i++) {
    const o = openings[i];
    if (y + r > o.y0 + 0.005 && y - r < o.y1 - 0.005) blocked.push([o.a, o.b]);
  }
  blocked.sort(function (p, q) { return p[0] - q[0]; });
  const out = [];
  let cur = a0;
  for (let i = 0; i < blocked.length; i++) {
    if (blocked[i][0] > cur) out.push([cur, Math.min(blocked[i][0], a1)]);
    cur = Math.max(cur, blocked[i][1]);
  }
  if (cur < a1) out.push([cur, a1]);
  return out.filter(function (s) { return s[1] - s[0] > 0.09; });
}

function addLogRow(b, along, fixed, y, r, span, openings) {
  const segs = logSegs(y, r, span[0], span[1], openings);
  for (let i = 0; i < segs.length; i++) {
    const a = segs[i][0], c = segs[i][1], len = c - a, mid = (a + c) * 0.5;
    const g = new THREE.CylinderGeometry(r * rnd(0.96, 1.04), r * rnd(0.96, 1.04), len, 8, 1);
    const tone = 0.55 + rnd(-0.045, 0.045);
    const col = new THREE.Color().setHSL(0.078, 0.34, tone, THREE.SRGBColorSpace);
    if (along === 'x') b.add(g, m4(mid, y, fixed, 0, 0, Math.PI / 2), col, len * 0.55, 1);
    else b.add(g, m4(fixed, y, mid, Math.PI / 2, 0, 0), col, len * 0.55, 1);
  }
}

const HUT_OPEN = {
  front: [
    { id: 'door', a: -0.61, b: 0.61, y0: 0, y1: 2.04 },
    { id: 'wl', a: -2.44, b: -1.54, y0: 1.03, y1: 1.73 },
    { id: 'wr', a: 1.54, b: 2.44, y0: 1.03, y1: 1.73 }
  ],
  back: [{ id: 'wb', a: -0.60, b: 0.60, y0: 1.05, y1: 1.75 }]
};

function resolveHole(o) {
  const gap = HUT.wallH / HUT.rows;
  let ya = o.y1, yb = o.y0;
  for (let i = 0; i < HUT.rows; i++) {
    const y = 0.17 + i * gap;
    if (y + HUT.logR > o.y0 + 0.005 && y - HUT.logR < o.y1 - 0.005) {
      ya = Math.min(ya, y - HUT.logR);
      yb = Math.max(yb, y + HUT.logR);
    }
  }
  return { a: o.a, b: o.b, ya: ya, yb: yb, w: o.b - o.a, h: yb - ya, cy: (ya + yb) * 0.5 };
}

function buildWalls() {
  const b = Builder();
  const rows = HUT.rows, gap = HUT.wallH / rows;
  for (let i = 0; i < rows; i++) {
    const y = 0.17 + i * gap;
    addLogRow(b, 'x', HUT.hd, y, HUT.logR, [-HUT.hw - 0.24, HUT.hw + 0.24], HUT_OPEN.front);
    addLogRow(b, 'x', -HUT.hd, y, HUT.logR, [-HUT.hw - 0.24, HUT.hw + 0.24], HUT_OPEN.back);
    addLogRow(b, 'z', HUT.hw, y, HUT.logR, [-HUT.hd - 0.24, HUT.hd + 0.24], []);
    addLogRow(b, 'z', -HUT.hw, y, HUT.logR, [-HUT.hd - 0.24, HUT.hd + 0.24], []);
  }
  for (let i = 0; i < 4; i++) {
    const sx = i % 2 === 0 ? 1 : -1, sz = i < 2 ? 1 : -1;
    b.add(new THREE.CylinderGeometry(0.2, 0.22, 0.86, 9), m4(sx * (HUT.hw + 0.03), 0.4, sz * (HUT.hd + 0.03), 0, 0, 0), C(0x8d6a48), 1, 1);
  }
  const shape = new THREE.Shape();
  shape.moveTo(-HUT.hw, 0);
  shape.lineTo(HUT.hw, 0);
  shape.lineTo(0, 1.75);
  shape.lineTo(-HUT.hw, 0);
  const gableGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.24, bevelEnabled: false });
  b.add(gableGeo, m4(0, HUT.wallH, HUT.hd - 0.24, 0, 0, 0), C(0x9c7752), 0.42, 0.42);
  b.add(gableGeo, m4(0, HUT.wallH, -HUT.hd, 0, 0, 0), C(0x9c7752), 0.42, 0.42);
  for (let s = 0; s < 2; s++) {
    const zf = s === 0 ? HUT.hd + 0.03 : -HUT.hd - 0.03;
    for (let i = 0; i < 11; i++) {
      const gx = -HUT.hw + 0.29 + i * 0.585;
      const gh = 1.75 * (1 - Math.abs(gx) / HUT.hw) - 0.02;
      if (gh < 0.14) continue;
      b.add(new THREE.BoxGeometry(0.545, gh, 0.13),
        m4(gx, HUT.wallH + gh * 0.5, zf, 0, 0, 0),
        new THREE.Color().setHSL(0.078, 0.32, 0.485 + (i % 3) * 0.032, THREE.SRGBColorSpace), 0.3, gh * 0.42);
    }
  }
  b.add(new THREE.BoxGeometry(HUT.hw * 2 - 0.16, 2.42, HUT.hd * 2 - 0.16),
    m4(0, 1.24, 0, 0, 0, 0), C(0x241a12), 1.4, 1.4);
  const mesh = b.build(matWood);
  scene.add(mesh);
}

function buildRoof() {
  const slope = Math.atan((HUT.ridgeY - HUT.wallH) / HUT.hw);
  const eaveX = HUT.eaveX;
  const eaveY = HUT.ridgeY - eaveX * Math.tan(slope);
  const len = Math.sqrt(eaveX * eaveX + Math.pow(HUT.ridgeY - eaveY, 2));
  const ang = -slope;
  const cx = eaveX * 0.5, cy = (HUT.ridgeY + eaveY) * 0.5;
  const b = Builder();
  for (let s = 0; s < 2; s++) {
    const sgn = s === 0 ? 1 : -1;
    const g = new THREE.BoxGeometry(len, 0.26, 6.7);
    swapUV(g);
    scaleUV(g, 3.4, 2.15);
    b.raw(g, m4(sgn * cx, cy, 0, 0, 0, sgn * ang), C(0xb98f66));
    for (let j = 0; j < 10; j++) {
      const t = (j + 0.5) / 10;
      const px = lerp(0.2, len - 0.12, t);
      const sg = new THREE.BoxGeometry(0.47, 0.045, 6.7);
      swapUV(sg);
      scaleUV(sg, 3.4, 0.5);
      const m = new THREE.Matrix4()
        .makeRotationZ(sgn * ang)
        .multiply(new THREE.Matrix4().makeTranslation(sgn * px, 0.14, 0))
        .premultiply(new THREE.Matrix4().makeTranslation(sgn * cx, cy, 0));
      b.raw(sg, m, j % 2 ? C(0xb0885f) : C(0xc2986d));
    }
    const soffit = new THREE.BoxGeometry(len * 0.97, 0.035, 6.52);
    swapUV(soffit);
    scaleUV(soffit, 3.4, 2.15);
    b.raw(soffit, m4(sgn * (cx - 0.06), cy - 0.156, 0, 0, 0, sgn * ang), C(0x4e3a26));
    b.add(new THREE.BoxGeometry(0.16, 0.30, 6.74), m4(sgn * (eaveX - 0.06), eaveY - 0.09, 0, 0, 0, 0), C(0xa58a62), 0.35, 1);
  }
  b.add(new THREE.BoxGeometry(0.34, 0.22, 6.86), m4(0, HUT.ridgeY + 0.10, 0, 0, 0, 0), C(0x7f8c58), 1, 3);
  scene.add(b.build(matPlank));

  const sb = Builder();
  for (let s = 0; s < 2; s++) {
    const sgn = s === 0 ? 1 : -1;
    const g = new THREE.BoxGeometry(len * 0.995, 0.1, 6.66);

    scaleUV(g, 3.4, 2.15);
    sb.raw(g, m4(sgn * (cx + 0.070), cy + 0.128, 0, 0, 0, sgn * ang), C(0xffffff));
  }
  sb.add(new THREE.BoxGeometry(0.48, 0.18, 6.85), m4(0, HUT.ridgeY + 0.20, 0, 0, 0, 0), C(0xffffff));
  const snowMat = new THREE.MeshLambertMaterial({
    color: C(0xf4f8fc), transparent: true, opacity: 0, depthWrite: false
  });
  roofSnowMesh = sb.build(snowMat, { noCast: true });
  roofSnowMesh.renderOrder = 2;
  scene.add(roofSnowMesh);
  roofParts.slope = slope;
  roofParts.len = len;
  roofParts.ang = ang;
  roofParts.cx = cx;
  roofParts.cy = cy;
  roofParts.eaveY = eaveY;
}

function petalGeo(len, wid, curl, cup, c0, c1) {
  const uSeg = 3, vSeg = 2;
  const verts = [], cols = [], idx = [], uvs = [];
  const ca = C(c0), cb = C(c1), tmp = new THREE.Color();
  for (let i = 0; i <= uSeg; i++) {
    const u = i / uSeg;
    const w = wid * Math.sin(Math.PI * Math.pow(u, 0.72));
    tmp.lerpColors(ca, cb, u);
    for (let j = 0; j <= vSeg; j++) {
      const v = j / vSeg * 2 - 1;
      verts.push(u * len, v * w, curl * u * u + cup * (1 - v * v) * 0.5);
      cols.push(tmp.r, tmp.g, tmp.b);
      uvs.push(u, (v + 1) * 0.5);
    }
  }
  for (let i = 0; i < uSeg; i++) {
    for (let j = 0; j < vSeg; j++) {
      const a = i * (vSeg + 1) + j, b = a + 1, c = a + vSeg + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function leafGeo(len, wid, droop, cup, c0, c1) {
  const uSeg = 4, vSeg = 2;
  const verts = [], cols = [], idx = [], uvs = [];
  const ca = C(c0), cb = C(c1), tmp = new THREE.Color();
  for (let i = 0; i <= uSeg; i++) {
    const u = i / uSeg;
    const w = wid * Math.sin(Math.PI * Math.pow(u, 0.62));
    tmp.lerpColors(ca, cb, u);
    for (let j = 0; j <= vSeg; j++) {
      const v = j / vSeg * 2 - 1;
      verts.push(u * len, -droop * u * u + cup * (1 - v * v), v * w);
      cols.push(tmp.r, tmp.g, tmp.b);
      uvs.push(u, (v + 1) * 0.5);
    }
  }
  for (let i = 0; i < uSeg; i++) {
    for (let j = 0; j < vSeg; j++) {
      const a = i * (vSeg + 1) + j, b = a + 1, c = a + vSeg + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function discGeo(rad, bulge) {
  const rings = 4, seg = 18;
  const verts = [0, 0, bulge], cols = [], idx = [];
  const base = new THREE.Color();
  const push = function (r, a) {
    const l = 0.20 + 0.085 * (0.5 + 0.5 * Math.sin(r * 88 + a * 11));
    base.setHSL(0.085, 0.42, l, THREE.SRGBColorSpace);
    cols.push(base.r, base.g, base.b);
  };
  push(0, 0);
  for (let k = 1; k <= rings; k++) {
    const r = rad * k / rings;
    for (let j = 0; j < seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      verts.push(Math.cos(a) * r, Math.sin(a) * r, bulge * (1 - Math.pow(r / rad, 2)));
      push(r, a);
    }
  }
  for (let j = 0; j < seg; j++) idx.push(0, 1 + j, 1 + (j + 1) % seg);
  for (let k = 1; k < rings; k++) {
    const a0 = 1 + (k - 1) * seg, b0 = 1 + k * seg;
    for (let j = 0; j < seg; j++) {
      const j2 = (j + 1) % seg;
      idx.push(a0 + j, b0 + j, a0 + j2, a0 + j2, b0 + j, b0 + j2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(cols.length / 3 * 2), 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildSunflowerGeo(variant) {
  const items = [];
  const H = 1.12 + variant * 0.16;
  const sway = variant ? 1 : -1;
  const green = C(0x50792f);
  const pts = [V3(0, 0, 0)];
  for (let i = 1; i <= 4; i++) {
    const t = i / 4;
    pts.push(V3(Math.sin(t * 1.9) * 0.055 * sway, t * H, (Math.cos(t * 2.4) - 1) * 0.05 * sway));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  items.push({ geo: new THREE.TubeGeometry(curve, 7, 0.038, 5, false), color: green });
  for (let i = 0; i < 3; i++) {
    const t = 0.26 + i * 0.23;
    const p = curve.getPoint(t);
    const az = i * 2.15 + (variant ? 0.85 : 0) + rnd(-0.3, 0.3);
    const lg = leafGeo(0.30 + rnd(0, 0.10), 0.115, 0.15 + rnd(0, 0.08), 0.022, 0x3d6a24, 0x7fae42);
    items.push({ geo: lg, matrix: m4(p.x, p.y, p.z, 0, az, -0.16 - rnd(0, 0.14)) });
  }
  const tip = curve.getPoint(1);
  const dir = V3(0.30 * sway, 0.56, 0.80).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 0, 1), dir);
  const headM = new THREE.Matrix4().compose(tip.clone().add(dir.clone().multiplyScalar(0.04)), q, V3(1, 1, 1));
  const hm = function (lm) { return headM.clone().multiply(lm); };
  const calyx = new THREE.ConeGeometry(0.135, 0.19, 9);
  calyx.rotateX(-Math.PI / 2);
  items.push({ geo: calyx, matrix: hm(m4(0, 0, -0.075, 0, 0, 0)), color: C(0x486f2b) });
  items.push({ geo: discGeo(0.158, 0.055), matrix: hm(m4(0, 0, 0.012, 0, 0, 0)) });
  const ring = function (n, r, len, wid, curl, cup, off, lenJ) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + off;
      const pg = petalGeo(len + rnd(-lenJ, lenJ), wid, curl, cup, 0xf0930c, 0xffd44e);
      items.push({ geo: pg, matrix: hm(m4(Math.cos(a) * r, Math.sin(a) * r, 0.018, 0, 0, a)) });
    }
  };
  ring(13, 0.148, 0.245, 0.060, 0.062, 0.022, 0, 0.022);
  ring(9, 0.102, 0.212, 0.053, 0.092, 0.020, 0.35, 0.018);
  const geo = mergeGeos(items);
  applyHeightAttr(geo, H + 0.34, 1.55);
  return geo;
}

const flowerData = [];

function placeSunflowers() {
  let guard = 0;
  while (flowerData.length < CFG.sunflowers && guard < 9000) {
    guard++;
    const x = rnd(-9.2, 9.2), z = rnd(4.7, 13.6);
    const ex = x / 8.9, ez = (z - 9.0) / 4.3;
    if (ex * ex + ez * ez > 1.0) continue;
    if (Math.abs(x) < 1.3 && z < 14.5) continue;
    if (z < 5.6 && Math.abs(x) < 3.2) continue;
    let ok = true;
    for (let i = 0; i < flowerData.length; i++) {
      const dx = flowerData[i].x - x, dz = flowerData[i].z - z;
      if (dx * dx + dz * dz < 0.46) { ok = false; break; }
    }
    if (!ok) continue;
    flowerData.push({
      x: x, z: z,
      s: rnd(0.82, 1.22),
      rot: rnd(0, 6.283),
      variant: flowerData.length % 2
    });
  }
}

function buildSunflowers() {
  placeSunflowers();
  const geos = [buildSunflowerGeo(0), buildSunflowerGeo(1)];
  const buckets = [[], []];
  for (let i = 0; i < flowerData.length; i++) buckets[flowerData[i].variant].push(flowerData[i]);
  const col = new THREE.Color();
  for (let v = 0; v < 2; v++) {
    const list = buckets[v];
    const im = new THREE.InstancedMesh(geos[v], matFlower, Math.max(1, list.length));
    im.count = list.length;
    for (let i = 0; i < list.length; i++) {
      const f = list[i];
      im.setMatrixAt(i, m4(f.x, 0, f.z, 0, f.rot, 0, f.s, f.s, f.s));
      col.setRGB(rnd(0.93, 1.0), rnd(0.92, 1.0), rnd(0.84, 0.97), THREE.SRGBColorSpace);
      im.setColorAt(i, col);
    }
    im.castShadow = false;
    im.receiveShadow = false;
    im.frustumCulled = false;
    scene.add(im);
    pickFlowers.push(im);
  }
}

function bladeGeo(h, w, bend) {
  const segs = 3;
  const verts = [], cols = [], idx = [], uvs = [];
  const c0 = C(0x59883c), c1 = C(0xa6ce63), tmp = new THREE.Color();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const ww = w * (1 - t * 0.88);
    const z = bend * t * t * h;
    tmp.lerpColors(c0, c1, t);
    verts.push(-ww * 0.5, h * t, z, ww * 0.5, h * t, z);
    cols.push(tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b);
    uvs.push(0, t, 1, t);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildWeeds() {
  const items = [];
  for (let i = 0; i < 5; i++) {
    const az = (i / 5) * Math.PI * 2 + rnd(-0.4, 0.4);
    const g = bladeGeo(1, rnd(0.055, 0.09), rnd(0.15, 0.42));
    items.push({ geo: g, matrix: m4(rnd(-0.03, 0.03), 0, rnd(-0.03, 0.03), 0, az, rnd(-0.22, 0.22)) });
  }
  const cluster = mergeGeos(items);
  applyHeightAttr(cluster, 1, 1.5);
  const im = new THREE.InstancedMesh(cluster, matWeed, CFG.weeds);
  const col = new THREE.Color();
  let placed = 0, guard = 0;
  const weedTarget = Math.round(CFG.weeds * PERF);
  while (placed < weedTarget && guard < 24000) {
    guard++;
    const a = rnd(0, 6.283);
    const r = Math.sqrt(R()) * 21.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(x) < 3.85 && Math.abs(z) < 3.1) continue;
    if (z > 2.6 && z < 14.5 && Math.abs(x) < 1.15) continue;
    if (Math.abs(x) < 1.9 && z < 3.9) continue;
    const hy = rnd(0.12, 0.42) * (r > 13 ? 1.15 : 1);
    im.setMatrixAt(placed, m4(x, 0, z, 0, rnd(0, 6.283), 0, rnd(0.85, 1.55), hy, rnd(0.85, 1.55)));
    col.setHSL(0.235 + rnd(-0.025, 0.045), rnd(0.16, 0.34), rnd(0.86, 1.0), THREE.SRGBColorSpace);
    im.setColorAt(placed, col);
    placed++;
  }
  im.count = placed;
  im.castShadow = false;
  im.receiveShadow = false;
  im.frustumCulled = false;
  scene.add(im);
  STATS.weeds = placed;
}

function addLimb(b, a, c, r0, r1, color, seg) {
  const A = V3(a[0], a[1], a[2]), B = V3(c[0], c[1], c[2]);
  const dir = B.clone().sub(A);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r1, r0, len, seg || 8, 1);
  g.translate(0, len * 0.5, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), dir.normalize());
  const mm = new THREE.Matrix4().compose(A, q, V3(1, 1, 1));
  scaleUV(g, Math.max(1.2, r0 * 7), Math.max(1, len * 0.55));
  b.items.push({ geo: g, matrix: mm, color: color });
}

function buildHeroTree(cfg) {
  const b = Builder(), fb = Builder();
  const barkA = C(0x7a5636), barkB = C(0x8e6640);
  const trunkPts = [
    [cfg.x, 0, cfg.z],
    [cfg.x + cfg.lean * 0.4, cfg.h * 0.4, cfg.z + 0.12],
    [cfg.x + cfg.lean, cfg.h * 0.75, cfg.z + 0.05],
    [cfg.x + cfg.lean * 1.2, cfg.h, cfg.z - 0.15]
  ];
  for (let i = 0; i < 3; i++) {
    const r0 = cfg.r * (1 - i * 0.24);
    const r1 = cfg.r * (1 - (i + 1) * 0.24);
    addLimb(b, trunkPts[i], trunkPts[i + 1], r0, r1, i % 2 ? barkA : barkB, 13);
  }
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.4;
    addLimb(b, [cfg.x, 0.35, cfg.z],
      [cfg.x + Math.cos(a) * 1.25, -0.15, cfg.z + Math.sin(a) * 1.25], cfg.r * 0.42, 0.1, barkA, 6);
  }
  for (let i = 0; i < cfg.branches.length; i++) {
    const br = cfg.branches[i];
    addLimb(b, br.a, br.b, br.r0, br.r1, barkB, 11);
    if (br.twig) {
      const B = V3(br.b[0], br.b[1], br.b[2]);
      addLimb(b, br.b, [B.x + br.twig[0], B.y + br.twig[1], B.z + br.twig[2]], br.r1 * 0.8, 0.03, barkA, 5);
    }
    if (br.tag) {
      const A = V3(br.a[0], br.a[1], br.a[2]), B2 = V3(br.b[0], br.b[1], br.b[2]);
      const p = A.clone().lerp(B2, br.t === undefined ? 0.72 : br.t);
      const r = lerp(br.r0, br.r1, 0.72);
      const dir = B2.clone().sub(A).normalize();
      ANCHORS[br.tag] = { p: V3(p.x, p.y + r * 0.92, p.z), dir: dir };
    }
  }
  for (let i = 0; i < cfg.blobs.length; i++) {
    const bl = cfg.blobs[i];
    const r = bl[3];
    fb.items.push({
      geo: new THREE.IcosahedronGeometry(r, 1),
      matrix: m4(bl[0], bl[1], bl[2], rnd(0, 3), rnd(0, 6.3), rnd(0, 3), 1, rnd(0.72, 0.92), 1),
      color: new THREE.Color().setHSL(0.265 + rnd(-0.035, 0.035), rnd(0.35, 0.5), rnd(0.30, 0.40), THREE.SRGBColorSpace)
    });
  }
  const m1 = b.build(matBark);
  const m2 = fb.build(matPaint);
  scene.add(m1);
  scene.add(m2);
}

function addAnimal(group, id, baseY) {
  const rec = { group: group, id: id, baseY: baseY, react: 0, blink: rnd(0, 3), phase: rnd(0, 6.28) };
  group.traverse(function (o) { if (o.isMesh) o.userData.animalId = id; });
  scene.add(group);
  animals.push(rec);
  return rec;
}

function wingGeo(sign) {
  const rows = 5, colsN = 5;
  const verts = [], cols = [], idx = [], uvs = [];
  for (let i = 0; i <= rows; i++) {
    const u = i / rows;
    const w = 0.049 * Math.sin(Math.PI * Math.pow(u, 0.66)) * (1 - 0.46 * Math.exp(-Math.pow((u - 0.58) / 0.15, 2)));
    const yc = 0.012 * Math.sin(Math.PI * u);
    for (let j = 0; j <= colsN; j++) {
      const v = j / colsN * 2 - 1;
      verts.push(sign * u * 0.10, yc + v * w, -0.0275 * u * u + 0.007 * (1 - v * v) * u);
      const e = smoothstep(0.5, 1.0, Math.abs(v));
      const base = lerp(1.0, 0.42, e * 0.85);
      const spot = Math.abs(v) < 0.22 && u > 0.3 && u < 0.72 ? 0.55 : 0;
      cols.push(base * (1 - spot), base * (1 - spot * 0.9), base * (1 - spot * 0.7));
      uvs.push(u, (v + 1) * 0.5);
    }
  }
  for (let i = 0; i < rows; i++) {
    for (let j = 0; j < colsN; j++) {
      const a = i * (colsN + 1) + j, b2 = a + 1, c = a + colsN + 1, d = c + 1;
      idx.push(a, b2, c, b2, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function butterflyBodyGeo() {
  const b = Builder();
  b.add(new THREE.SphereGeometry(1, 10, 8), m4(0, 0, 0, 0, 0, 0, 0.011, 0.010, 0.042), C(0x2b2119));
  b.add(new THREE.SphereGeometry(0.013, 8, 6), m4(0, 0.003, 0.046, 0, 0, 0), C(0x39301f));
  for (let s = 0; s < 2; s++) {
    const sx = s === 0 ? -1 : 1;
    b.add(new THREE.CylinderGeometry(0.0018, 0.0022, 0.052, 4), m4(sx * 0.012, 0.024, 0.058, -0.75, 0, sx * 0.4), C(0x2b2119));
    b.add(new THREE.SphereGeometry(0.004, 6, 5), m4(sx * 0.025, 0.043, 0.040, 0, 0, 0), C(0x1e1812));
  }
  return mergeGeos(b.items);
}

const butterflies = [];

function buildButterflies() {
  const N = CFG.butterflies;
  if (!flowerData.length || N <= 0) { STATS.butterflies = 0; return; }
  bfWingR = new THREE.InstancedMesh(wingGeo(1), matWingB, N);
  bfWingL = new THREE.InstancedMesh(wingGeo(-1), matWingB, N);
  bfBody = new THREE.InstancedMesh(butterflyBodyGeo(), matBody, N);
  const palette = [0xff8a3d, 0x5fa8e0, 0xf6f1e2, 0xffd34a, 0xd97ad0, 0x8fd0c0];
  const c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const f = flowerData[i % flowerData.length];
    butterflies.push({
      cx: f.x * 0.6, cz: 0,
      rx: rnd(2.0, 5.4), rz: rnd(1.0, 2.6),
      spd: rnd(0.32, 0.6), ph: rnd(0, 6.283),
      y0: rnd(1.0, 2.3), land: 0, landP: V3(0, 0, 0)
    });
    butterflies[i].cz = rnd(5.0 + butterflies[i].rz, 11.5 - butterflies[i].rz);
    c.setHex(palette[i % palette.length]);
    bfWingR.setColorAt(i, c);
    bfWingL.setColorAt(i, c);
  }
  [bfWingR, bfWingL, bfBody].forEach(function (m) {
    m.frustumCulled = false;
    scene.add(m);
  });
  STATS.butterflies = N;
}

function beeBodyGeo() {
  const g = new THREE.SphereGeometry(1, 14, 10);
  g.scale(0.025, 0.025, 0.036);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const cy = C(0xf2c14a), cb = C(0x2a2116), tmp = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i);
    const band = Math.sin(z * 216 + 0.6) > -0.15 ? 1 : 0;
    tmp.copy(band ? cy : cb);
    cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const b = Builder();
  b.raw(g, m4(0, 0, 0, 0, 0, 0), null);
  b.add(new THREE.SphereGeometry(0.018, 10, 8), m4(0, 0, 0.036, 0, 0, 0), C(0x241c12));
  b.add(new THREE.SphereGeometry(0.0042, 6, 5), m4(-0.008, 0.009, 0.049, 0, 0, 0), C(0x0f0c08));
  b.add(new THREE.SphereGeometry(0.0042, 6, 5), m4(0.008, 0.009, 0.049, 0, 0, 0), C(0x0f0c08));
  b.add(new THREE.ConeGeometry(0.014, 0.026, 6), m4(0, 0, -0.043, -Math.PI / 2, 0, 0), C(0x1b150e));
  return mergeGeos(b.items);
}

function buildBees() {

      fx: f.x, fz: f.z, fy: 1.16 * f.s,

const bfM = new THREE.Matrix4(), bfQ = new THREE.Quaternion(), bfE = new THREE.Euler();
const bfP = new THREE.Vector3(), bfS = new THREE.Vector3(1, 1, 1);
const wingM = new THREE.Matrix4(), rotM = new THREE.Matrix4(), mirM = new THREE.Matrix4();

function camFade(p) {
  const dx = p.x - camera.position.x, dy = p.y - camera.position.y, dz = p.z - camera.position.z;
  return smoothstep(1.0, 2.4, Math.sqrt(dx * dx + dy * dy + dz * dz));
}

function updateInsects(t, dt, activity) {
  if (!bfWingR) return;
  for (let i = 0; i < butterflies.length; i++) {
    const b = butterflies[i];
    const tt = t * b.spd + b.ph;
    const x = b.cx + Math.sin(tt) * b.rx + Math.sin(tt * 2.3) * 0.5;
    const z = b.cz + Math.cos(tt * 0.78) * b.rz;
    const y = b.y0 + Math.sin(tt * 1.7) * 0.32;
    const nx = b.cx + Math.sin(tt + 0.06) * b.rx + Math.sin((tt + 0.06) * 2.3) * 0.5;
    const nz = b.cz + Math.cos((tt + 0.06) * 0.78) * b.rz;
    const yaw = Math.atan2(nx - x, nz - z);
    bfE.set(Math.sin(tt * 1.7) * 0.22, yaw, Math.sin(tt * 2.1) * 0.16);
    bfQ.setFromEuler(bfE);
    bfP.set(x, y, z);
    const sc = activity > 0.4 ? (0.58 + 0.42 * activity) * camFade(bfP) : 0.001;
    bfS.set(sc, sc, sc);
    bfM.compose(bfP, bfQ, bfS);
    const flap = Math.sin(t * 21 + b.ph) * 0.92;
    rotM.makeRotationZ(flap);
    wingM.multiplyMatrices(bfM, rotM);
    bfWingR.setMatrixAt(i, wingM);
    rotM.makeRotationZ(-flap);
    wingM.multiplyMatrices(bfM, rotM);
    bfWingL.setMatrixAt(i, wingM);
    bfBody.setMatrixAt(i, bfM);
  }
  bfWingR.instanceMatrix.needsUpdate = true;
  bfWingL.instanceMatrix.needsUpdate = true;
  bfBody.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < bees.length; i++) {
    const b = bees[i];
    const tt = t * b.spd + b.ph;
    const x = b.fx + Math.cos(tt) * b.rad;
    const z = b.fz + Math.sin(tt) * b.rad * 0.8;
    const y = b.fy + Math.sin(tt * 2.6) * b.bob;
    const yaw = Math.atan2(-Math.sin(tt), Math.cos(tt) * 0.8);
    bfE.set(Math.sin(tt * 3) * 0.2, yaw, 0);
    bfQ.setFromEuler(bfE);
    bfP.set(x, y, z);
    const s = activity > 0.4 ? (0.58 + 0.42 * activity) * camFade(bfP) : 0.001;
    bfS.set(s, s, s);
    bfM.compose(bfP, bfQ, bfS);
    beeBodyIM.setMatrixAt(i, bfM);
    const flap = Math.sin(t * 62 + i) * 0.85;
    rotM.makeRotationZ(flap);
    wingM.multiplyMatrices(bfM, rotM);
    beeWingIM.setMatrixAt(i * 2, wingM);
    rotM.makeRotationZ(-flap);
    mirM.makeScale(-1, 1, 1);
    rotM.multiply(mirM);
    wingM.multiplyMatrices(bfM, rotM);
    beeWingIM.setMatrixAt(i * 2 + 1, wingM);
  }
  beeBodyIM.instanceMatrix.needsUpdate = true;
  beeWingIM.instanceMatrix.needsUpdate = true;
}

const FIRE_N = 72;
let fireflies = null, fireData = [];

function buildFireflies() {
  const pos = new Float32Array(FIRE_N * 3);
  for (let i = 0; i < FIRE_N; i++) {
    const a = rnd(0, 6.283), r = rnd(2, 15);
    fireData.push({
      x: Math.cos(a) * r, z: Math.sin(a) * r + 6,
      y: rnd(0.4, 2.6), ph: rnd(0, 6.283), sp: rnd(0.5, 1.3), amp: rnd(0.5, 1.6)
    });
    pos[i * 3] = fireData[i].x;
    pos[i * 3 + 1] = fireData[i].y;
    pos[i * 3 + 2] = fireData[i].z;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    map: TEX.soft, color: C(0xffe083), size: 0.36, transparent: true,
    opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  fireflies = new THREE.Points(g, m);
  fireflies.frustumCulled = false;
  scene.add(fireflies);
}

function updateFireflies(t, vis) {
  if (!fireflies) return;
  fireflies.material.opacity = vis * 0.95;
  if (vis < 0.02) return;
  const p = fireflies.geometry.attributes.position;
  for (let i = 0; i < fireData.length; i++) {
    const f = fireData[i];
    p.setXYZ(i,
      f.x + Math.sin(t * f.sp * 0.7 + f.ph) * f.amp,
      f.y + Math.sin(t * f.sp + f.ph * 1.7) * 0.42,
      f.z + Math.cos(t * f.sp * 0.55 + f.ph) * f.amp);
  }
  p.needsUpdate = true;
}

function buildSkyProps() {
  const sp = new Float32Array(900 * 3);
  for (let i = 0; i < 900; i++) {
    const th = rnd(0, 6.283);
    const ph = Math.acos(1 - R() * 0.99);
    const r = 400;
    sp[i * 3] = r * Math.sin(ph) * Math.cos(th);
    sp[i * 3 + 1] = r * Math.cos(ph);

  };
}

function lerpState(out, a, b, t) {
  for (const k in a) {
    const va = a[k], vb = b[k];
    if (va && va.isColor) out[k].lerpColors(va, vb, t);
    else if (va && va.isVector3) out[k].lerpVectors(va, vb, t);
    else out[k] = va + (vb - va) * t;
  }
  out.sunDir.normalize();
}

function setWeather(key, instant) {
  if (!PRESETS[key]) return;
  wKey = key;
  if (instant) {
    cloneInto(wCur, PRESETS[key]);
    wT = 1; wSwitching = false;
  } else {
    cloneInto(wFrom, wCur);
    cloneInto(wTo, PRESETS[key]);
    wT = 0; wSwitching = true;
  }
  applyWeatherState(wCur);
  if (typeof syncWeatherUI === 'function') syncWeatherUI();
}

function cloneInto(dst, src) {
  for (const k in src) {
    const v = src[k];
    if (v && v.isColor) dst[k].copy(v);
    else if (v && v.isVector3) dst[k].copy(v);
    else dst[k] = v;
  }
}

function updateWeather(dt) {
  if (wSwitching) {
    wT += dt / wDur;
    if (wT >= 1) { wT = 1; wSwitching = false; }
    lerpState(wCur, wFrom, wTo, easeInOut(wT));
  }
  applyWeatherState(wCur);

  if (wKey === 'rain' || wKey === 'snow') {
    flashNext -= dt;
    if (flashNext <= 0) {
      flashT = 1;
      flashNext = rnd(5, 13);
    }
  }
  if (flashT > 0) {
    flashT = Math.max(0, flashT - dt * 3.4);
    const f = flashT * flashT * (wKey === 'rain' ? 1 : 0.45);
    hemi.intensity += f * 3.2;
    amb.intensity += f * 2.6;
    scene.fog.color.lerp(WHITE, f * 0.55);
  }
}

function updateParticles(t, dt, camPos) {
  const sx = Math.round(camPos.x / 8) * 8, sz = Math.round(camPos.z / 8) * 8;
  if (rainLines.visible) {
    rainLines.position.set(sx, 0, sz);
    const p = rainLines.geometry.attributes.position;
    const wx = wCur.wind * 0.22, wz = wCur.wind * 0.09;
    for (let i = 0; i < RAIN_N; i++) {
      const d = rainData[i];
      d.y -= d.v * dt;
      if (d.y < -1) { d.y += 27; d.x = rnd(-22, 22); d.z = rnd(-22, 22); }
      p.setXYZ(i * 2, d.x, d.y, d.z);
      p.setXYZ(i * 2 + 1, d.x + wx, d.y - d.l * 1.6, d.z + wz);
    }
    p.needsUpdate = true;
  }
  if (snowPoints.visible) {
    snowPoints.position.set(sx, 0, sz);
    const p = snowPoints.geometry.attributes.position;
    for (let i = 0; i < snowN; i++) {
      const d = snowData[i];
      d.y -= d.v * dt;
      if (d.y < -1) { d.y += 27; d.x = rnd(-22, 22); d.z = rnd(-22, 22); }
      const sway = Math.sin(t * 0.9 + d.s) * 0.55;
      p.setXYZ(i, d.x + sway, d.y, d.z + Math.cos(t * 0.7 + d.s) * 0.4);
    }
    p.needsUpdate = true;
  }
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    c.a += c.spd * dt;
    c.sp.position.set(Math.cos(c.a) * c.r, c.y, Math.sin(c.a) * c.r);
  }
}

const CAM_TARGET = V3(0, 2.35, 0);
const cam = {
  theta: 0.10, phi: 0.415 * Math.PI, radius: 16.6,
  tTheta: 0.10, tPhi: 0.415 * Math.PI, tRadius: 16.6
};
const PRESET_CAM = [
  { theta: 0.10, phi: 0.415, r: 16.6 },
  { theta: 0.0, phi: 0.44, r: 11.5 },
  { theta: 0.62, phi: 0.235, r: 31.0 }
];
const PHI_MIN = 0.12 * Math.PI, PHI_MAX = 0.46 * Math.PI;
const R_MIN = 8, R_MAX = 45;
const CAM_BLOCKERS = [
  { x: -8.4, y: 5.6, z: 2.0, r: 2.45 },
  { x: 8.6, y: 5.8, z: 1.2, r: 2.55 }
];
let autoOrbit = true, idleT = 0, lastInput = 0;

function pushCamOut(p) {
  for (let i = 0; i < CAM_BLOCKERS.length; i++) {
    const b = CAM_BLOCKERS[i];
    const dx = p.x - b.x, dy = p.y - b.y, dz = p.z - b.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (d < b.r && d > 0.0001) {
      const k = b.r / d;
      p.x = b.x + dx * k;
      p.z = b.z + dz * k;
      p.y = Math.max(1.1, b.y + dy * k);
    }
  }
}

function applyCamera(dt) {
  const k = 1 - Math.exp(-13 * dt);
  cam.theta += (cam.tTheta - cam.theta) * k;
  cam.phi += (cam.tPhi - cam.phi) * k;
  cam.radius += (cam.tRadius - cam.radius) * k;
  const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  const boost = Math.max(0, cam.radius - 24) * 0.55;
  camera.position.set(
    CAM_TARGET.x + cam.radius * sp * Math.sin(cam.theta),
    Math.max(0.85, CAM_TARGET.y + cam.radius * cp + boost),
    CAM_TARGET.z + cam.radius * sp * Math.cos(cam.theta)
  );
  pushCamOut(camera.position);
  camera.lookAt(CAM_TARGET);
}

function setCameraPreset(i) {
  const p = PRESET_CAM[Math.max(0, Math.min(PRESET_CAM.length - 1, i | 0))];
  cam.tTheta = p.theta;
  cam.tPhi = p.phi * Math.PI;
  cam.tRadius = p.r;
  lastInput = performance.now();
}

function initInput() {
  const el = renderer.domElement;
  const pointers = new Map();
  let moved = 0, downT = 0, lastX = 0, lastY = 0, pinch = 0;

  el.addEventListener('pointerdown', function (e) {
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      lastX = e.clientX; lastY = e.clientY; moved = 0; downT = performance.now();
    } else if (pointers.size === 2) {
      const it = Array.from(pointers.values());
      pinch = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
    }
    lastInput = performance.now();
  });

  el.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastInput = performance.now();
    if (pointers.size === 1) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      cam.tTheta -= dx * 0.0062;
      cam.tPhi = clamp(cam.tPhi - dy * 0.0045, PHI_MIN, PHI_MAX);
    } else if (pointers.size === 2) {
      const it = Array.from(pointers.values());
      const d = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      if (pinch > 0) cam.tRadius = clamp(cam.tRadius * (pinch / d), R_MIN, R_MAX);
      pinch = d;
      moved += 4;
    }
  });

  function release(e) {
    if ((e.type === 'pointerup' || e.type === 'pointercancel') && pointers.size === 1 &&
      moved < 8 && performance.now() - downT < 480) {
      handleClick(e.clientX, e.clientY);
    }
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', function (e) { pointers.delete(e.pointerId); });

  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    cam.tRadius = clamp(cam.tRadius * Math.exp(e.deltaY * 0.0011), R_MIN, R_MAX);
    lastInput = performance.now();
  }, { passive: false });

  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) return;
    if (e.key >= '1' && e.key <= '6') {
      setWeather(WKEYS[parseInt(e.key, 10) - 1], false);
    } else if (e.key === 'ArrowLeft') {
      cam.tTheta += 0.18; lastInput = performance.now();
    } else if (e.key === 'ArrowRight') {
      cam.tTheta -= 0.18; lastInput = performance.now();
    } else if (e.key === ' ') {
      e.preventDefault();
      toggleOrbit();
    }
  });
}

function makeBurst(tex, size, count) {
  const N = count || 9;
  const pos = new Float32Array(N * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    map: tex, size: size, transparent: true, opacity: 0, depthWrite: false,
    sizeAttenuation: true
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  pts.visible = false;
  scene.add(pts);
  const vel = new Float32Array(N * 3);
  const o = { pts: pts, pos: pos, vel: vel, life: 0, N: N };
  o.spawn = function (p) {
    for (let i = 0; i < N; i++) {
      const a = rnd(0, 6.283), r = rnd(0, 0.28);
      pos[i * 3] = p.x + Math.cos(a) * r;
      pos[i * 3 + 1] = p.y + rnd(-0.1, 0.16);
      pos[i * 3 + 2] = p.z + Math.sin(a) * r;
      vel[i * 3] = Math.cos(a) * rnd(0.3, 0.9);
      vel[i * 3 + 1] = rnd(0.9, 1.9);
      vel[i * 3 + 2] = Math.sin(a) * rnd(0.3, 0.9);
    }
    g.attributes.position.needsUpdate = true;
    o.life = 1;
    pts.visible = true;
    m.opacity = 1;
  };
  o.update = function (dt) {
    if (o.life <= 0) return;
    o.life -= dt / 1.45;
    if (o.life <= 0) { pts.visible = false; return; }
    for (let i = 0; i < N; i++) {
      pos[i * 3] += vel[i * 3] * dt;
      pos[i * 3 + 1] += vel[i * 3 + 1] * dt;
      pos[i * 3 + 2] += vel[i * 3 + 2] * dt;
      vel[i * 3 + 1] -= dt * 1.15;
    }
    g.attributes.position.needsUpdate = true;
    m.opacity = Math.min(1, o.life * 1.6);
  };
  return o;
}

let heartBurst = null, sparkBurst = null;

function handleClick(cx, cy) {
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  const groups = animals.map(function (a) { return a.group; });
  let hits = raycaster.intersectObjects(groups, true);
  if (hits.length) {
    const id = hits[0].object.userData.animalId;
    const rec = animals.find(function (a) { return a.id === id; });
    if (rec) {
      rec.react = 1;
      heartBurst.spawn(hits[0].point);
      return;
    }
  }
  hits = raycaster.intersectObjects(pickFlowers, false);
  if (hits.length) {
    const p = hits[0].point;
    gustState.x = p.x; gustState.z = p.z; gustState.w = 1;
    sparkBurst.spawn(V3(p.x, p.y + 0.1, p.z));
  }
}

function updateAnimals(t, dt) {
  for (let i = 0; i < animals.length; i++) {
    const a = animals[i];
    if (a.react > 0) a.react = Math.max(0, a.react - dt * 1.5);
    const rj = a.react > 0 ? Math.sin((1 - a.react) * Math.PI) : 0;
    if (a.id === 'squirrel') {
      const cyc = (t * 0.42 + a.phase) % 1;
      const hopY = cyc < 0.14 ? Math.sin(cyc / 0.14 * Math.PI) * 0.07 : 0;
      a.group.position.y = a.baseY + hopY + rj * 0.26;
      a.group.rotation.z = Math.sin(t * 1.6 + a.phase) * 0.05 + rj * 0.12;
      a.tail.rotation.z = Math.sin(t * 2.6 + a.phase) * 0.26;
      a.tail.rotation.x = -0.1 + Math.sin(t * 2.1 + a.phase * 1.3) * 0.16;
      a.cone.rotation.z = Math.sin(t * 2.4) * 0.06;
    } else if (a.id === 'owl') {
      const targetY = Math.sin(t * 0.42 + a.phase) * 0.42 + rj * Math.sin(t * 12) * 0.5;
      a.head.rotation.y += (targetY - a.head.rotation.y) * Math.min(1, dt * 4);
      a.head.rotation.z = Math.sin(t * 0.9) * 0.05;
      a.group.position.y = a.baseY + Math.sin(t * 1.1) * 0.008 + rj * 0.05;
      a.blink -= dt;
      let sy = 1;
      if (a.blink < 0.14 && a.blink > 0) sy = 0.10;
      if (a.blink <= 0) a.blink = rnd(2.6, 6.5);
      a.eyes[0].scale.y += (sy - a.eyes[0].scale.y) * Math.min(1, dt * 26);
      a.eyes[1].scale.y = a.eyes[0].scale.y;
    } else {
      const cyc = (t * 0.55 + a.phase) % 1;
      const hopY = cyc < 0.09 ? Math.sin(cyc / 0.09 * Math.PI) * 0.05 : 0;
      a.group.position.y = a.baseY + hopY + rj * 0.16;
      const flap = Math.sin(t * 17 + a.phase) * 0.55 + 0.35;
      a.wings[0].rotation.z = -flap - rj * 0.5;
      a.wings[1].rotation.z = flap + rj * 0.5;
      a.group.rotation.y += Math.sin(t * 0.8 + a.phase) * dt * 0.35;
    }
  }
}

// ============================================================
// UI / 主循环 / 调试接口
// ============================================================
function buildUI() {
  const bar = document.getElementById('weather-bar');
  for (let i = 0; i < WKEYS.length; i++) {
    const k = WKEYS[i];
    const btn = document.createElement('button');
    btn.className = 'wbtn';
    btn.setAttribute('data-key', k);
    btn.innerHTML = '<span class="ic">' + WICON[k] + '</span><span>' + WLABEL[k] + '</span>';
    btn.addEventListener('click', function () { setWeather(k, false); });
    bar.appendChild(btn);
  }
  document.getElementById('orbit-toggle').addEventListener('click', toggleOrbit);
}

function syncWeatherUI() {
  const btns = document.querySelectorAll('.wbtn');
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('on', btns[i].getAttribute('data-key') === wKey);
  }
  const el = document.getElementById('i-weather');
  if (el) el.textContent = WLABEL[wKey];
}

function toggleOrbit() {
  autoOrbit = !autoOrbit;
  const b = document.getElementById('orbit-toggle');
  b.textContent = autoOrbit ? '开启' : '关闭';
  b.classList.toggle('on', autoOrbit);
  lastInput = performance.now();
}

let resizeTimer = 0;
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const wantFov = h > w ? 58 : 46;
  if (camera.fov !== wantFov) camera.fov = wantFov;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 100);
});

const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0, fpsShow = 60, lastCalls = 0, uiT = 0;

function updateWind(t) {
  const uf = matFlower.userData.uni;
  const uw = matWeed.userData.uni;
  uf.uTime.value = t;
  uw.uTime.value = t;
  uf.uGust.value.set(gustState.x, gustState.z, 0, gustState.w);
  uw.uGust.value.set(gustState.x, gustState.z, 0, gustState.w * 0.6);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (autoOrbit && performance.now() - lastInput > 8000) {
    cam.tTheta += dt * 0.048;
  }
  applyCamera(dt);
  updateWeather(dt);
  updateWind(t);
  gustState.w = Math.max(0, gustState.w - dt * 2.4);
  updateAnimals(t, dt);
  updateInsects(t, dt, wCur.act);
  updateFireflies(t, wCur.fire);
  updateParticles(t, dt, camera.position);
  heartBurst.update(dt);
  sparkBurst.update(dt);

  renderer.render(scene, camera);
  lastCalls = renderer.info.render.calls;

  fpsAcc += dt;
  fpsFrames++;
  uiT += dt;
  if (fpsAcc > 0.5) {
    fpsShow = fpsFrames / fpsAcc;
    fpsAcc = 0; fpsFrames = 0;
  }
  if (uiT > 0.45) {
    uiT = 0;
    const fe = document.getElementById('i-fps');
    if (fe) fe.textContent = Math.round(fpsShow);
  }
}

function exposeAPI() {
  window.__LINLIN__ = {
    ready: true,
    version: '1.0.0',
    getWeather: function () { return wKey; },
    setWeather: function (k, instant) { setWeather(k, instant === true); },
    listWeather: function () { return WKEYS.slice(); },
    setCameraPreset: function (i) { setCameraPreset(i); },
    cameraPresets: PRESET_CAM.length,
    stats: function () {
      return {
        fps: Math.round(fpsShow),
        drawCalls: lastCalls,
        triangles: renderer.info.render.triangles,
        weather: wKey
      };
    }
  };
  document.documentElement.setAttribute('data-ready', '1');
  document.body.setAttribute('data-ready', '1');
}

function boot() {
  buildUI();
  heartBurst = makeBurst(TEX.heart, 0.55);
  sparkBurst = makeBurst(TEX.sparkle, 0.44);
  initInput();
  applyWeatherState(wCur);
  if (IS_MOBILE) {
    const hint = document.querySelector('#info-card .hint');
    if (hint) hint.innerHTML = '单指旋转 · 双指缩放<br>点击小动物 · 1-6 换天气';
  }
  syncWeatherUI();
  applyCamera(1);
  renderer.render(scene, camera);
  lastCalls = renderer.info.render.calls;
  exposeAPI();
  const ld = document.getElementById('loader');
  setTimeout(function () { ld.classList.add('hide'); }, 260);
  clock.start();
  animate();
}

boot();

</script>
