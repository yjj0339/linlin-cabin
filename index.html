<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8ec5e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="霖林小屋">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>霖林小屋 · Linlin Cabin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1410;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}

.glass{
  background:rgba(255,255,255,.58);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:0 8px 28px rgba(28,45,30,.16),inset 0 1px 0 rgba(255,255,255,.85);
}

#title{
  position:fixed;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));
  padding:12px 20px 13px;border-radius:18px;z-index:20;pointer-events:none;
  opacity:0;transform:translateY(-8px);animation:fadeDown .9s .35s cubic-bezier(.2,.8,.3,1) forwards}
#title h1{font-size:17px;font-weight:600;letter-spacing:.16em;color:#22301f;line-height:1.2}
#title p{font-size:10px;letter-spacing:.24em;color:rgba(34,48,31,.5);margin-top:5px;font-weight:500;text-transform:uppercase}

#weather{
  position:fixed;left:50%;transform:translateX(-50%) translateY(12px);
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;
  display:flex;gap:4px;padding:6px;border-radius:999px;
  opacity:0;animation:fadeUp .9s .5s cubic-bezier(.2,.8,.3,1) forwards}
#weather.hide, #title.hide, #hint.hide{opacity:0!important;transition:opacity .45s;pointer-events:none}
.wbtn{
  position:relative;display:flex;align-items:center;gap:7px;
  padding:10px 16px;border:0;border-radius:999px;background:transparent;
  color:rgba(34,48,31,.62);font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;transition:background .28s cubic-bezier(.2,.8,.3,1),color .28s,box-shadow .28s,transform .2s}
.wbtn svg{width:16px;height:16px;transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.wbtn:hover{color:#22301f;background:rgba(255,255,255,.42)}
.wbtn:active{transform:scale(.94)}
.wbtn.on{background:#fff;color:#1d2a1b;box-shadow:0 3px 10px rgba(28,45,30,.18),0 0 0 .5px rgba(0,0,0,.04)}
.wbtn.on svg{transform:scale(1.06)}
.wbtn .lb{white-space:nowrap}
.wdot{position:absolute;left:50%;bottom:-1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;
  background:#7fb069;opacity:0;transition:opacity .3s}
.wbtn.on .wdot{opacity:1}

#hint{
  position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));
  font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.9);z-index:20;
  text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none;opacity:0;
  animation:fadeIn 1s 1.8s forwards}

#loader{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(120% 90% at 50% 20%,#eaf4e4 0%,#c8dfae 45%,#8fb87a 100%);
  transition:opacity 1s cubic-bezier(.4,0,.2,1),visibility 1s}
#loader.done{opacity:0;visibility:hidden}
.ldmark{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.ldring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(45,70,40,.16);
  border-top-color:rgba(45,70,40,.65);animation:spin 1.1s linear infinite}
.ldleaf{font-size:22px;animation:breathe 2.4s ease-in-out infinite}
.ldtxt{font-size:11.5px;letter-spacing:.36em;color:rgba(38,56,34,.62);font-weight:600;padding-left:.36em}
.ldbar{width:150px;height:2px;border-radius:2px;background:rgba(45,70,40,.14);overflow:hidden}
.ldbar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#6f9e58,#a8c98a);transition:width .4s}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(-4deg);opacity:.85}50%{transform:scale(1.14) rotate(4deg);opacity:1}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeUp{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeDown{to{opacity:1;transform:translateY(0)}}

@media (max-width:560px){
  #title{padding:10px 16px 11px;border-radius:15px}
  #title h1{font-size:14.5px;letter-spacing:.12em}
  #title p{font-size:8.5px;letter-spacing:.2em;margin-top:3px}
  #weather{width:calc(100% - 24px);justify-content:space-between;gap:0;padding:5px;border-radius:22px}
  .wbtn{flex:1;flex-direction:column;gap:3px;padding:8px 2px;font-size:10px;border-radius:18px}
  .wbtn svg{width:17px;height:17px}
  .wdot{display:none}
  #hint{display:none}
}
@media (max-height:430px) and (orientation:landscape){
  #title{display:none}
  #weather{bottom:calc(8px + env(safe-area-inset-bottom));padding:4px}
  .wbtn{padding:6px 12px;font-size:10.5px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="title" class="glass">
  <h1>霖林小屋</h1>
  <p>Linlin Cabin</p>
</div>

<div id="weather" class="glass">
  <button class="wbtn on" data-weather="sunny">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
    </svg><span class="lb">晴</span><i class="wdot"></i>
  </button>
  <button class="wbtn" data-weather="foggy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M4 9h11M17 9h3M3 13.5h9M14.5 13.5h6M6 18h12"/>
    </svg><span class="lb">雾</span><i class="wdot"></i>
  </button>
  <button class="wbtn" data-weather="sunset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M3 18h18M6.5 18a5.5 5.5 0 0 1 11 0"/><path d="M12 3.5v2M5 6l1.4 1.4M19 6l-1.4 1.4"/>
    </svg><span class="lb">黄昏</span><i class="wdot"></i>
  </button>
  <button class="wbtn" data-weather="night">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M20 14.6A8.4 8.4 0 0 1 9.4 4a8.4 8.4 0 1 0 10.6 10.6Z"/>
    </svg><span class="lb">夜</span><i class="wdot"></i>
  </button>
  <button class="wbtn" data-weather="rain">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M6.4 13.5a3.6 3.6 0 0 1 .5-7.2 5 5 0 0 1 9.5-1.1 3.5 3.5 0 0 1 1.2 6.8"/>
      <path d="M8 17l-1 2.6M12.4 17l-1 2.6M16.8 17l-1 2.6"/>
    </svg><span class="lb">雨</span><i class="wdot"></i>
  </button>
</div>

<div id="hint">拖动旋转 · 双指缩放</div>

<div id="loader">
  <div class="ldmark"><div class="ldring"></div><div class="ldleaf">🌿</div></div>
  <div class="ldtxt">霖林小屋</div>
  <div class="ldbar"><i></i></div>
</div>

<script src="three.min.js"></script>
<script src="js/tex.js"></script>
<script src="js/world.js"></script>
<script src="js/flora.js"></script>
<script src="js/life.js"></script>
<script src="js/main.js"></script>
</body>
</html>
